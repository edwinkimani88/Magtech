name: Build & Release MagTech APK

on:
  push:
    branches: [main]
    paths:
      - 'magtech app/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Create .env file from secrets
        working-directory: "magtech app"
        run: |
          cp .env.example .env

      - name: Build Debug APK
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "8.11.1"
          build-root-directory: "magtech app"
          arguments: assembleDebug --no-daemon --no-configuration-cache --stacktrace

      - name: Verify & Copy Compiled APK
        run: |
          mkdir -p release-artifacts
          FOUND_APK=$(find "magtech app" -name "*.apk" -type f | head -n 1)
          echo "Found APK file at: $FOUND_APK"
          if [ -z "$FOUND_APK" ]; then
            echo "::error::No compiled APK file was produced by Gradle build!"
            exit 1
          fi
          cp "$FOUND_APK" "release-artifacts/magtech-admin.apk"
          APK_BYTES=$(wc -c < "release-artifacts/magtech-admin.apk")
          echo "Compiled APK size: $APK_BYTES bytes"
          if [ "$APK_BYTES" -lt 1000000 ]; then
            echo "::error::Compiled APK file size ($APK_BYTES bytes) is too small to be valid!"
            exit 1
          fi
          echo "APK_SIZE=$(du -sh release-artifacts/magtech-admin.apk | cut -f1)" >> $GITHUB_ENV

      - name: Get version info
        id: version
        run: |
          echo "VERSION=1.0.0" >> $GITHUB_OUTPUT
          echo "DATE=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT
          echo "SHA=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Delete existing release tag if exists
        uses: dev-drprasad/delete-tag-and-release@v1.0
        with:
          tag_name: v1.0.0
          github_token: ${{ secrets.GITHUB_TOKEN }}
          delete_release: true
        continue-on-error: true

      - name: Create GitHub Release v1.0.0
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "MagTech Admin App — v1.0.0"
          body: |
            ## 📱 MagTech Admin App — Release Build

            **Version:** 1.0.0
            **Built:** ${{ steps.version.outputs.DATE }}
            **Commit:** ${{ steps.version.outputs.SHA }}
            **Size:** ${{ env.APK_SIZE }}

            ### Installation
            1. Download `magtech-admin.apk` below
            2. On your Android device go to **Settings → Security → Install unknown apps**
            3. Enable **"Allow from this source"** for your browser/file manager
            4. Open the downloaded APK and tap **Install**
            5. Log in with your MagTech admin credentials
          files: release-artifacts/magtech-admin.apk
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
