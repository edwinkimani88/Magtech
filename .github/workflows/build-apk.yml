name: Build & Release MagTech APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('magtech app/gradle/libs.versions.toml', 'magtech app/build.gradle.kts', 'magtech app/app/build.gradle.kts') }}
          restore-keys: |
            gradle-

      - name: Create .env file from secrets
        working-directory: "magtech app"
        run: |
          cp .env.example .env

      - name: Build Debug APK
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: "9.3.1"
          build-root-directory: "magtech app"
          arguments: assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p release-artifacts
          cp "magtech app/app/build/outputs/apk/debug/app-debug.apk" "release-artifacts/magtech-admin.apk"
          echo "APK_SIZE=$(du -sh release-artifacts/magtech-admin.apk | cut -f1)" >> $GITHUB_ENV

      - name: Get version info
        id: version
        run: |
          echo "VERSION=1.0.$(date +'%Y%m%d')" >> $GITHUB_OUTPUT
          echo "DATE=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT
          echo "SHA=${GITHUB_SHA::7}" >> $GITHUB_OUTPUT

      - name: Delete existing 'latest' release (if any)
        uses: dev-drprasad/delete-tag-and-release@v1.0
        with:
          tag_name: latest
          github_token: ${{ secrets.GITHUB_TOKEN }}
          delete_release: true
        continue-on-error: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "MagTech Admin APK — v${{ steps.version.outputs.VERSION }}"
          body: |
            ## 📱 MagTech Admin App — Debug Build

            **Version:** ${{ steps.version.outputs.VERSION }}
            **Built:** ${{ steps.version.outputs.DATE }}
            **Commit:** ${{ steps.version.outputs.SHA }}
            **Size:** ${{ env.APK_SIZE }}

            ### Installation
            1. Download `magtech-admin.apk` below
            2. On your Android device go to **Settings → Security → Install unknown apps**
            3. Enable **"Allow from this source"** for your browser/file manager
            4. Open the downloaded APK and tap **Install**
            5. Log in with your MagTech admin credentials

            > ⚠️ This is a debug build for internal use only.
          files: release-artifacts/magtech-admin.apk
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
