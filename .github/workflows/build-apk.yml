name: Build & Release MagTech APK

on:
  push:
    branches: [main]
    paths:
      - 'magtech investments app/**'
      - '.github/workflows/build-apk.yml'
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Debug APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Create .env file from secrets
        working-directory: "magtech investments app"
        run: |
          cp .env.example .env

      - name: Make gradlew executable
        run: chmod +x "magtech investments app/gradlew"

      - name: Set up Gradle 8.14
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14'

      - name: Build Debug APK
        working-directory: "magtech investments app"
        run: gradle assembleDebug --no-daemon --no-configuration-cache --stacktrace

      - name: Verify & Copy Compiled APK
        run: |
          mkdir -p release-artifacts
          FOUND_APK=$(find "magtech investments app" -name "*.apk" -type f | head -n 1)
          echo "Found APK file at: $FOUND_APK"
          if [ -z "$FOUND_APK" ]; then
            echo "::error::No compiled APK file was produced by Gradle build!"
            exit 1
          fi
          cp "$FOUND_APK" "release-artifacts/magtech-admin.apk"
          cp "$FOUND_APK" "release-artifacts/Magtech loans.apk"
          APK_BYTES=$(wc -c < "release-artifacts/Magtech loans.apk")
          echo "Compiled APK size: $APK_BYTES bytes"
          if [ "$APK_BYTES" -lt 1000000 ]; then
            echo "::error::Compiled APK file size ($APK_BYTES bytes) is too small to be valid!"
            exit 1
          fi
          echo "APK_SIZE=$(du -sh release-artifacts/magtech-admin.apk | cut -f1)" >> $GITHUB_ENV

      - name: Get version info
        id: version
        run: |
          BUILD_DATE=$(date +'%Y-%m-%d')
          SHORT_SHA=${GITHUB_SHA::7}
          echo "VERSION=1.0.0" >> $GITHUB_OUTPUT
          echo "DATE=$BUILD_DATE" >> $GITHUB_OUTPUT
          echo "SHA=$SHORT_SHA" >> $GITHUB_OUTPUT
          # Also expose for APK config constants
          echo "APK_VERSION=1.0.0" >> $GITHUB_ENV
          echo "APK_RELEASE_DATE=$BUILD_DATE" >> $GITHUB_ENV

      - name: Delete existing release tag if exists
        uses: dev-drprasad/delete-tag-and-release@v1.0
        with:
          tag_name: v1.0.0
          github_token: ${{ secrets.GITHUB_TOKEN }}
          delete_release: true
        continue-on-error: true

      - name: Create GitHub Release v1.0.0
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "MagTech Admin App — v1.0.0"
          body: |
            ## 📱 MagTech Loans App — Release Build

            **Version:** 1.0.0
            **Built:** ${{ steps.version.outputs.DATE }}
            **Commit:** ${{ steps.version.outputs.SHA }}
            **Size:** ${{ env.APK_SIZE }}

            ### Installation
            1. Download `Magtech loans.apk` below
            2. On your Android device go to **Settings → Security → Install unknown apps**
            3. Enable **"Allow from this source"** for your browser/file manager
            4. Open the downloaded APK and tap **Install**
            5. Log in with your MagTech admin credentials
          files: |
            release-artifacts/magtech-admin.apk
            release-artifacts/Magtech loans.apk
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Deploy latest APK to downloads/ folder
        run: |
          # Copy fresh APK into the website's downloads folder so the static link is always current
          cp "release-artifacts/Magtech loans.apk" "downloads/Magtech loans.apk"
          echo "APK deployed to downloads/ — $(du -sh 'downloads/Magtech loans.apk' | cut -f1)"

      - name: Commit & push updated APK to repo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "downloads/Magtech loans.apk"
          git diff --cached --quiet && echo "No APK change to commit" || \
            git commit -m "chore: update downloads/Magtech loans.apk [${{ steps.version.outputs.DATE }} ${{ steps.version.outputs.SHA }}]"
          git push
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
